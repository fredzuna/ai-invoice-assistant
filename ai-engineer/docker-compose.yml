services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://billforge:billforge@postgres:5432/billforge
      LLM_BASE_URL: http://model-gateway:8001
      EMBEDDING_BASE_URL: http://embedding-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: billforge
      POSTGRES_PASSWORD: billforge
      POSTGRES_DB: billforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billforge -d billforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  # model gateway simulation
  model-gateway:
    build: ./services/model_gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  embedding-service:
    build: ./services/embedding_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
